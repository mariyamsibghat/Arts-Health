<style>

}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 Inter, system-ui, sans-serif; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 980px; margin: 0 auto; padding-block: 28px 48px; }

.lede { color: var(--muted); margin: 0 0 24px; max-width: 62ch; }
.arrow { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 10px; border-top: 2px solid var(--line); padding-top: 10px; font-size: 12px; color: var(--muted); }
.stage { display: flex; justify-content: center; align-items: center; padding: 18px 0 8px; }
.circle { --d: clamp(210px, 32vw, 300px); position: relative; width: var(--d); height: var(--d); flex: none; border-radius: 50%; border: 2px solid transparent; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 30px; cursor: pointer; color: var(--fg); font: inherit; transition: transform .2s ease, box-shadow .2s ease; }
.circle + .circle { margin-left: calc(var(--d) * -0.2); }
.circle:hover { transform: translateY(-2px); }
.circle:focus-visible { outline: 3px solid var(--fg); outline-offset: 4px; }
.circle .t { font: 600 17px/1.25 Newsreader, Georgia, serif; text-wrap: balance; }
.circle .more { margin-top: 12px; font-size: 12px; font-weight: 500; color: #fff; background: color-mix(in srgb, var(--c) 72%, #000); border: 0; border-radius: 999px; padding: 6px 14px; }
.circle .dot { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: color-mix(in srgb, var(--c) 72%, #000); border: 2px solid var(--surface); transform: translate(-50%, -50%); box-shadow: 0 0 0 1px var(--fg); cursor: default; }
.circle .dot:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.circle.everyday { --c: var(--everyday); background: color-mix(in srgb, var(--everyday) 24%, transparent); border-color: var(--everyday); }
.circle.public { --c: var(--public); background: color-mix(in srgb, var(--public) 24%, transparent); border-color: var(--public); }
.circle.care { --c: var(--care); background: color-mix(in srgb, var(--care) 24%, transparent); border-color: var(--care); }
.circle[aria-expanded="true"] { box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--fg); }
.panel { margin-top: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.panel h2 { font: 600 22px/1.2 Newsreader, Georgia, serif; margin: 0 0 10px; text-wrap: balance; }
.panel .desc { margin: 0 0 6px; max-width: 70ch; }
.panel .draft { font-size: 12px; color: var(--muted); margin: 0 0 16px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.act { font: inherit; font-size: 14px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 9px 18px; cursor: pointer; }
.act[aria-pressed="true"] { background: var(--fg); color: var(--surface); border-color: var(--fg); }
.act:focus-visible, .chip:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.sec { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 16px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.chip b { font-weight: 600; color: var(--muted); margin-left: 4px; }
.chip .tent { color: var(--tent); margin-left: 6px; font-size: 11px; }
.chip[aria-pressed="true"] { border-color: var(--fg); }
.st { padding: 12px 0; border-bottom: 1px solid var(--line); }
.st:last-child { border-bottom: 0; }
.st .n { font: 600 15px/1.35 Newsreader, Georgia, serif; text-wrap: balance; }
.st .m { font-size: 12px; color: var(--muted); margin-top: 2px; }
.st a { font-size: 12px; color: var(--link); overflow-wrap: anywhere; }
.empty { color: var(--muted); margin: 0; }
.nodeform { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 8px; }
.nodeform select, .nodeform input { font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.nodeform input { grid-column: 1 / -1; }
.nodeform button { grid-column: 1 / -1; justify-self: start; font: inherit; font-size: 13px; color: var(--surface); background: var(--fg); border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; }
.nodeform .msg { grid-column: 1 / -1; font-size: 12px; color: var(--muted); min-height: 1em; }
.nodelist { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
.nodelist li { font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; max-width: 100%; overflow-wrap: anywhere; }
.note { margin-top: 20px; font-size: 12px; color: var(--muted); max-width: 70ch; }

@media (max-width: 640px) {

  .stage.has-sel .circle:not([aria-expanded="true"]) .more, .stage.has-sel .circle:not([aria-expanded="true"]) .cnt { display: none; }
  .stage.has-sel .circle[aria-expanded="true"] { --d: min(250px, 72vw); flex: 0 0 var(--d); order: 2; margin: 8px auto 0; }

@media (prefers-reduced-motion: reduce) { .circle { transition: none; } }

function parseCSV(text) {
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
      else if (c === '"') q = false;
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (c !== '\r') field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;

  try {
    const res = await fetch(PUBLIC_CSV);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = parseCSV(await res.text()).slice(1);
    NODES = rows.filter(r => r.length >= 4 && r[3]).map(r => ({
      group: TITLE_TO_GROUP[r[0]] || null,
      kind: r[1] === 'Other' ? (r[2] || 'Other') : r[1],
      name: r[3], org: r[4] || ''
    })).filter(n => n.group);
    LOADED = true;
  } catch (e) { LOAD_FAILED = true; }
  update();
}

function renderEvidence() {
  const g = GROUPS[group];
  const chips = $('chips'); chips.innerHTML = '';
  g.subs.forEach(name => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.setAttribute('aria-pressed', String(sub === name));
    b.textContent = name;
    const n = document.createElement('b'); n.textContent = countFor(name); b.appendChild(n);
    if (g.tentative && g.tentative.includes(name)) { const t = document.createElement('span'); t.className = 'tent'; t.textContent = 'to confirm'; b.appendChild(t); }
    b.addEventListener('click', () => { sub = sub === name ? null : name; update(); });
    chips.appendChild(b);
  });
  const box = $('studies'); box.innerHTML = '';
  if (!sub) { box.innerHTML = '<p class="empty">Choose a sub-theme to see its studies.</p>'; return; }
  const items = STUDIES.filter(s => inSub(s, sub)).sort((x, y) => (y.priority || 0) - (x.priority || 0));
  if (!items.length) { box.innerHTML = '<p class="empty">No studies with a DOI under this sub-theme yet.</p>'; return; }
  items.forEach(s => {
    const row = document.createElement('div'); row.className = 'st';
    const n = document.createElement('div'); n.className = 'n'; n.textContent = s.title;
    const m = document.createElement('div'); m.className = 'm';
    m.textContent = s.author + ', ' + s.year + ' · ' + (s.art || 'Art form blank');
    const a = document.createElement('a'); a.href = 'https://doi.org/' + s.doi; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'doi:' + s.doi;
    row.appendChild(n); row.appendChild(m); row.appendChild(a); box.appendChild(row);
  });
}

function renderNodes() {
  const ul = $('nodelist'); ul.innerHTML = '';
  $('regStatus').textContent = LOAD_FAILED ? 'Registrations appear on the public page.' : (LOADED ? '' : 'Loading registrations…');
  NODES.filter(n => n.group === group).forEach(n => {
    const li = document.createElement('li');
    li.textContent = n.kind + ': ' + n.name + (n.org ? ', ' + n.org : '');
    ul.appendChild(li);
  });
}

function update() {
  document.querySelectorAll('.circle').forEach(c => {
    const k = c.dataset.group;
    const on = k === group;
    c.setAttribute('aria-expanded', String(on));
    c.querySelector('.more').textContent = on ? 'Close' : 'Read more';
    c.querySelectorAll('.dot').forEach(d => d.remove());
    const list = NODES.filter(x => x.group === k);
    list.forEach((n, i) => {
      const ang = (-90 + (360 / list.length) * i + 180 / (list.length || 1)) * Math.PI / 180;
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.setAttribute('role', 'img');
      dot.setAttribute('aria-label', n.name + (n.org ? ', ' + n.org : '') + ' (' + (n.kind || 'registered') + ')');
      dot.title = n.name + (n.org ? ', ' + n.org : '') + ' · ' + (n.kind || '');
      dot.style.left = (50 + 50 * Math.cos(ang)).toFixed(2) + '%';
      dot.style.top = (50 + 50 * Math.sin(ang)).toFixed(2) + '%';
      c.appendChild(dot);
    });
  });
  document.querySelector('.stage').classList.toggle('has-sel', !!group);
  const panel = $('panel');
  panel.hidden = !group;
  if (!group) return;
  const g = GROUPS[group];
  $('ptitle').textContent = g.title;
  $('pdesc').textContent = g.fig;
  $('pdraft').textContent = g.note;
  $('btnExplore').setAttribute('aria-pressed', String(mode === 'explore'));
  $('btnRegister').setAttribute('aria-pressed', String(mode === 'register'));
  $('evidence').hidden = mode !== 'explore';
  $('register').hidden = mode !== 'register';
  if (mode === 'explore') renderEvidence();
  if (mode === 'register') { $('formLink').href = FORM_URL; renderNodes(); }
}

document.querySelectorAll('.circle').forEach(c => c.addEventListener('click', () => {
  const k = c.dataset.group;
  group = group === k ? null : k;
  mode = null; sub = null;
  update();
}));
$('btnExplore').addEventListener('click', () => { mode = mode === 'explore' ? null : 'explore'; sub = null; update(); });
$('btnRegister').addEventListener('click', () => { mode = mode === 'register' ? null : 'register'; update(); });

update();
loadRegistrations();
</script>
